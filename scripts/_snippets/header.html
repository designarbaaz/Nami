<header class="site-header">

      <a href="#hero" class="brand-mark-link visible" id="headerBrandMark" aria-label="NAMI Home">
        <img src="/assets/Main-logo.svg" alt="NAMI" class="brand-mark-img">
      </a>
    </div>

    <div class="header-nav-wrap">
      <!-- Circular Page Scroller: Resor Rotary Mixer Knobs ( C ) ( W ) ( F ) ( S ) -->
      <nav class="section-scroller" aria-label="Section scroller">
        <!-- Node C: Concept -->
        <div class="scroller-node">
          <a href="#philosophy" class="scroller-btn" data-section="philosophy" aria-label="Concept">
            <svg class="knob-svg" viewBox="0 0 24 23.5" aria-hidden="true">
              <!-- Static Graduation Ticks (Mixer Faceplate Scale) -->
              
              <!-- Rotary Dial Body & Position Notch (Turns on Hover & Active) -->
              <g class="knob-rotor">
                <path class="knob-dial" d="M18.3,12.2c0,3.5-2.8,6.3-6.3,6.3s-6.3-2.8-6.3-6.3,2.1-5.4,4.9-6.1c0,0,.2,0,.3,0,.4-.1.7-.2,1.1-.2s.7,0,1.1.1c.1,0,.2,0,.3.1C16.2,6.8,18.3,9.3,18.3,12.2Z"/>

                <rect class="knob-notch-tip" x="11.8" y="3.6" width=".4" height=".7"/>
              </g>
            </svg>
            <span class="knob-label">C</span>
            <span class="tooltip">Concept</span>
          </a>
        </div>
